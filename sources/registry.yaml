version: 1
registry_name: market-claim-verifier public data sources

# Ground-truth inputs used by the program.  Claim-source tiers below describe
# the provenance of real-world claims and are deliberately separate from SEC
# evidence tiers L1-L4.
sources:
  - id: sec-edgar-companyfacts
    kind: ground_truth
    publisher: U.S. Securities and Exchange Commission
    product: EDGAR XBRL companyfacts API
    url_pattern: https://data.sec.gov/api/xbrl/companyfacts/CIK{cik10}.json
    access_method: HTTPS GET; cache the JSON response and record sha256
    required_user_agent: "descriptive application name contact@example.com"
    fair_access_rate_limit: "10 req/s"
    fair_access_rate_limit_rps: 10
    terms: U.S. government public data; use the SEC fair-access guidance and identify the client with a User-Agent.
    update_cadence: on filing; companyfacts is refreshed as tagged filings are accepted and processed
    coverage: US issuers filing XBRL, with GAAP facts as tagged in the record
    not_covered:
      - management guidance and forecasts
      - non-GAAP measures unless separately tagged as a fact
      - most segment KPIs and operational metrics
      - market prices and returns
    known_limitations:
      - XBRL tagging errors and inconsistent units
      - concept and taxonomy changes over time
      - issuer-specific fiscal calendars and 52/53-week years
      - comparative periods can be restated in later filings
  - id: sec-edgar-company-tickers
    kind: ground_truth_lookup
    publisher: U.S. Securities and Exchange Commission
    product: EDGAR company ticker map
    url_pattern: https://www.sec.gov/files/company_tickers.json
    access_method: HTTPS GET; cache the JSON response
    required_user_agent: "descriptive application name contact@example.com"
    fair_access_rate_limit: "10 req/s"
    fair_access_rate_limit_rps: 10
    terms: U.S. government public data; use the SEC fair-access guidance and identify the client with a User-Agent.
    update_cadence: when the SEC updates the public ticker map
    coverage: ticker to CIK lookup for issuers in the SEC map
    known_limitations:
      - multiple share classes can map to one CIK
      - ticker changes and stale cached mappings require snapshot awareness
  - id: sec-edgar-earnings-release
    kind: ground_truth
    publisher: Issuer, furnished through U.S. Securities and Exchange Commission EDGAR
    product: 8-K Item 2.02 Exhibit 99.1 earnings release and HTML Exhibit 99.2
    url_pattern: https://www.sec.gov/Archives/edgar/data/{cik}/{accession_compact}/{exhibit}.htm
    discovery: SEC submissions JSON Item 2.02 entries, then filing-index exhibit links
    access_method: HTTPS GET; cache raw bytes with URL, retrieval timestamp and verified sha256
    required_user_agent: "DappGo market-claim-verifier admin@dappgo.com"
    fair_access_rate_limit: "10 req/s; shared client gate uses 9 req/s"
    fair_access_rate_limit_rps: 10
    coverage: Literal issuer guidance, labeled non-GAAP results and consolidated reported release totals
    known_limitations:
      - Furnished and unaudited; evidence strength is medium at most
      - No PDF OCR, image-only slides, or numeric mapping for verbal ranges
      - Missing outlook or ambiguous label, unit or period yields insufficient_evidence
      - Exact-period L1/L2 XBRL takes precedence on a release conflict

claim_source_tiers:
  primary:
    definition: Direct issuer material or a filing-level source controlled by the issuer.
    examples:
      - issuer press release
      - SEC 8-K filing
      - issuer investor-relations page
  major_press:
    definition: Wire services and established general or financial-news outlets reporting the issuer's claim.
    examples:
      - Reuters
      - Associated Press
      - Bloomberg
      - major newspaper or financial-news outlet
  aggregator:
    definition: Market-data or news aggregators and trading-platform blogs that repackage information from other sources.
    examples:
      - market-data aggregator
      - news aggregator
      - trading-platform blog
  social:
    definition: A post, thread, video caption, or other claim published on a social network.
    examples:
      - X post
      - LinkedIn post
      - public forum or social-network post
  generated:
    definition: Synthetic evaluation claim generated for testing rather than a real-world publication.
    examples:
      - generated benchmark claim
      - perturbed evaluation claim

publication_policy:
  source_reliability:
    per_domain_minimum_claims: 20
    confidence_interval: Wilson 95%
    small_domain_policy: aggregate by claim-source tier only; do not publish a per-domain reliability estimate
  claim_storage:
    article_claims: Store short paraphrases with URL, title, and publication date.
    verbatim_text: Never store verbatim article text.
  evidence_tiers:
    L1: Value appears in a 10-K or 10-K/A audited annual filing.
    L2: Value appears only in a 10-Q or 10-Q/A reviewed quarterly filing.
    L3: Value is derived by the program, such as an annual fact minus a nine-month YTD fact; component tiers are retained.
    L4: Literal issuer earnings-release evidence furnished in an Item 2.02 8-K Ex 99.1 or text Ex 99.2; unaudited.
  strength_levels:
    high: L1, at least two filing confirmations, and no restatement.
    medium: L1/L2, a non-restated L3 derivation without a form fallback, or furnished and unaudited L4 evidence.
    low: Restated evidence, a derivation using a restated or fallback component, or a single form-fallback filing.
