[project]
name = "claimcheck"
version = "0.1.0"
description = "Agent that checks financial claims against SEC EDGAR filings using Meta Muse models"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "pillow>=11",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcheck"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs/scripts"]
pythonpath = ["src"]
