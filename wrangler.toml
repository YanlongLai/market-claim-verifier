# Free Pages Functions proxy to the Access-protected self-hosted Python service.
# LIVE_ORIGIN_HOST is a hostname; Access credentials and origin token are secrets.
# No provider key lives here. See deploy/README.md.
name = "market-claim-verifier"
pages_build_output_dir = "docs"
compatibility_date = "2026-11-02"

# Pages rejects [observability]; Functions log nothing themselves.

# Pages reads plain-text vars from this file once it exists; dashboard plain-text vars are ignored.
# Secrets (LIVE_ACCESS_CLIENT_ID/SECRET, LIVE_ORIGIN_TOKEN) stay in the dashboard.
[vars]
LIVE_ORIGIN_HOST = "live-origin.dappgo.com"
