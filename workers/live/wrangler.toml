name = "market-claim-verifier-live"
main = "src/entry.py"
compatibility_date = "2026-11-02"
compatibility_flags = ["python_workers"]
workers_dev = false
preview_urls = false
# Required Worker secrets, supplied interactively: LIVE_CHECK_PASSWORD, BASETEN_API_KEY.
# No password disables paid checks; do not put secret values in [vars].

[limits]
cpu_ms = 30000

[vars]
DAILY_BUDGET_USD = "3"
TOTAL_BUDGET_USD = "20"

[build]
command = "python3 ../../scripts/build_live_worker.py"

[[durable_objects.bindings]]
name = "SPEND_GATE"
class_name = "SpendGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendGate"]

[observability]
enabled = false
