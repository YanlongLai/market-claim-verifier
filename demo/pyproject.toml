[project]
name = "market-claim-verifier-demo"
version = "0.1.0"
description = "Reproducible, content-cached hackathon demo video pipeline"
requires-python = ">=3.12,<3.15"
dependencies = ["PyYAML==6.0.3", "Pillow==12.3.0"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
