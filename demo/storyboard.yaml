  narration: 'An agent looks up SEC data for each one. Amazon, 143.1 billion: true. NVIDIA, more than double:
    true. Apple, 416 billion in one quarter: false. That''s the whole year. The quarter was 102.5 billion.'
  on_screen: 2 · Verdict for every claim
  director_notes: 'Step 2. Amazon and NVIDIA flip TRUE; Apple flips FALSE. At FALSE, Apple opens in a separate
    right column and both TRUE cards remain visible in the left column. Immediately show “Post says $416.2B
    in one quarter”, coral “Fiscal Q4 2025: $102.5B”, grey “Full fiscal year 2025: $416.2B”, both proportional
    bars and “4× too high · that''s the full year”. All detail is fully visible at “That''s the whole year”
    and “The quarter was 102.5 billion”; a restrained eight-second push never overlaps NVIDIA.'
  visual:
    kind: motion
