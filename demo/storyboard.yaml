  narration: 'The key design: the model proposes, the program decides. Code re-reads the number and its precision,
    checks fiscal and calendar years, and rejects any evidence the model made up.'
  on_screen: Model proposes · program decides
  director_notes: 'Two large lanes fill over 60% of the safe area. MODEL: Plan SEC lookups → Cite E1, E2.
    PROGRAM: Number ±0.05B → Fiscal ↔ calendar → Evidence. A fake E9 receives a coral ✕ at “rejects”. Short
    labels are at least 56 px and numeric/evidence tokens at least 96 px.'
  visual:
    kind: motion
