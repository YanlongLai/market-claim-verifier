# Demo video storyboard — the single source of truth for every build.
# Edit narration or visuals here, then rebuild (see demo/README.md). Each scene's length follows its narration audio
# (plus pad_s); `target_s` is the director's budget and the build warns when a scene runs >25% over it.
#
# visual.kind:
#   capture  — scripted browser recording of the public site/explorer (demo/capture/<id>.mjs)
#   image    — Codex-generated still (prompt in demo/prompts/img/<id>.md), slow Ken Burns zoom
#   card     — rendered title/end card (HTML template in demo/cards/)
# on_screen: short lower-third text burned in (keep ≤ 8 words). Subtitles come from narration automatically.

version: 1
title: "Market Claim Verifier — demo"
target_total_s: 170          # hackathon limit is 3:00; keep 10 s of slack
resolution: [1920, 1080]
fps: 30
capture:
  viewport: [1280, 720]      # CSS pixels; larger text than a 1920×1080 CSS viewport
  scale: 1.5                 # Record at the delivery resolution above
  color_scheme: dark
voice:
  engine: breeze-tts-2       # fallback: macos-say (draft only)
  instruction: >-
    A calm, confident male narrator in his thirties with a clear American accent, warm but precise,
    medium pace, like a product engineer explaining something he built.
  seed: 1234
music:
  engine: ace-step
  prompt_file: demo/prompts/music/bed.md
  gain_db: -22               # bed under narration; ducked further while voice is active
site_url: https://yanlonglai.github.io/market-claim-verifier/site/
explorer_url: https://yanlonglai.github.io/market-claim-verifier/explorer/

scenes:
  - id: s01-hook
    target_s: 14
    narration: >-
      Finance posts move fast. "Amazon made a hundred and forty-three billion last quarter."
      "Tesla grew three percent." Some of these are right. Some are quietly wrong. And almost nobody checks.
    visual: {kind: image}
    on_screen: "Numbers spread faster than facts"

  - id: s02-problem
    target_s: 15
    narration: >-
      Ask a language model on its own, and it guesses. On our test of three hundred fifty-seven finance claims,
      Muse Spark answering from memory was right only twenty to forty-four percent of the time.
    visual: {kind: capture, page: site, focus: "#chart", emphasis: without}
    on_screen: "Model alone: 20–44% correct"

  - id: s03-what
    target_s: 10
    narration: >-
      So we built Market Claim Verifier. Paste a post, and every number is checked against the company's own
      SEC filings.
    visual: {kind: capture, page: site, focus: "hero"}
    on_screen: "Market Claim Verifier"

  - id: s04-extract
    target_s: 22
    narration: >-
      Here's a thread with six claims. Muse Spark pulls out each checkable claim with its exact quote.
      Forecasts and opinions are labeled, not judged. Then each claim goes to an agent that looks up SEC data.
    visual: {kind: capture, page: site, focus: "example-en"}
    on_screen: "Extract claims · skip opinions"

  - id: s05-verdicts
    target_s: 20
    narration: >-
      Amazon, one hundred forty-three point one billion: true. NVIDIA, sixty point nine billion, more than double:
      true. Tesla grew three percent: false. The filing shows revenue fell about three percent.
    visual: {kind: capture, page: site, focus: "verdicts-en"}
    on_screen: "Tesla: +3% claimed, −2.9% filed"

  - id: s06-filing
    target_s: 20
    narration: >-
      Every verdict links to proof. Click "See filing" to get the exact table row from the ten-K or ten-Q,
      with the number highlighted, and a link that jumps straight to it in the original filing.
    visual: {kind: capture, page: site, focus: "filing-modal"}
    on_screen: "Proof: the exact filing line"

  - id: s07-how
    target_s: 24
    narration: >-
      The key design: the model proposes, the program decides. Muse Spark plans the lookups and cites evidence.
      But code makes the call. It re-reads the number, its precision, and words like "more than", checks both
      fiscal and calendar years, and rejects any evidence the model made up.
    visual: {kind: image}
    on_screen: "Model proposes · program decides"

  - id: s08-results
    target_s: 24
    narration: >-
      We committed the answers before running anything. With tools and program checks, accuracy rises to
      eighty-three percent on the Meta Model API, and ninety point five percent with open-weight Muse Spark on
      Baseten and Fireworks. Up to seventy points better than the model alone.
    visual: {kind: capture, page: site, focus: "#results", emphasis: with-checks}
    on_screen: "Open weights: 90.5% · pre-registered"

  - id: s09-chinese
    target_s: 9
    narration: >-
      It works in Chinese too, including units like "yi", a hundred million.
    visual: {kind: capture, page: site, focus: "example-zh"}
    on_screen: "English · 中文"

  - id: s10-close
    target_s: 14
    narration: >-
      Everything here was built this week for the Meta hackathon, on Muse Spark and Meta's open weights.
      The code, the evaluation, and every trace are public. Market Claim Verifier: check the number before you share it.
    visual: {kind: card, template: end}
    on_screen: "github.com/YanlongLai/market-claim-verifier"
