title = "Market Claim Verifier: defaults plus narrowly scoped media hash exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  # These fields are SHA-256 content/cache identifiers, produced by
  # demo/pipeline.py and demo/motion_build.py, not credentials.
  [[rules.allowlists]]
  description = "SHA-256 motion input identifier in committed media records"
  condition = "AND"
  paths = ['''(^|/)demo/motion/(timing\.json|data\.js)$''']
  regexTarget = "line"
  regexes = ['''^\s*"input_key"\s*:\s*"[0-9a-f]{64}",?\s*$''']

  [[rules.allowlists]]
  description = "SHA-256 assembly/music cache identifiers in committed run records"
  condition = "AND"
  paths = ['''(^|/)demo/runs/[0-9TZ]+-v[0-9]+\.json$''']
  regexTarget = "line"
  regexes = ['''^\s*"(assembly_cache_key|music_cache_key)"\s*:\s*"[0-9a-f]{64}",?\s*$''']
