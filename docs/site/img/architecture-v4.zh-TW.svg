<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">模型提出，程式判定</title>
  <desc id="desc">貼文經模型擷取與工具選擇、申報事實、程式判定，產出修正版草稿。</desc>
  <rect width="1920" height="1080" fill="#111a20"/>
  <g font-family="Arial, sans-serif" fill="#f7f5ef" text-anchor="middle">
    <text x="960" y="192" font-size="72" font-weight="700">模型提出，程式判定。</text>
    <g id="node-0"><rect x="64" y="340" width="328" height="330" rx="16" fill="#1a2930" stroke="#8ddab8" stroke-width="3"/><text x="228" y="522" font-size="64">貼文</text></g>
    <g id="link-0" stroke="#8ddab8" stroke-width="5" fill="none"><path d="M398 505h15m-9-10 10 10-10 10"/></g>
    <g id="node-1"><rect x="418" y="340" width="328" height="330" rx="16" fill="#1a2930" stroke="#8ddab8" stroke-width="3"/><text x="582" y="430" font-size="56" font-weight="700">查核模型</text><text x="582" y="516" font-size="56">擷取主張</text><text x="582" y="588" font-size="56">選擇工具</text></g>
    <g id="link-1" stroke="#8ddab8" stroke-width="5" fill="none"><path d="M752 505h15m-9-10 10 10-10 10"/></g>
    <g id="node-2"><rect x="772" y="340" width="328" height="330" rx="16" fill="#1a2930" stroke="#8ddab8" stroke-width="3"/><text x="936" y="475" font-size="64">證管會</text><text x="936" y="562" font-size="64">申報事實</text></g>
    <g id="link-2" stroke="#8ddab8" stroke-width="5" fill="none"><path d="M1106 505h15m-9-10 10 10-10 10"/></g>
    <g id="node-3"><rect x="1126" y="340" width="328" height="330" rx="16" fill="#8ddab8"/><text x="1290" y="475" font-size="64" fill="#111a20" font-weight="700">程式</text><text x="1290" y="562" font-size="64" fill="#111a20">判定</text></g>
    <g id="link-3" stroke="#8ddab8" stroke-width="5" fill="none"><path d="M1460 505h15m-9-10 10 10-10 10"/></g>
    <g id="node-4"><rect x="1480" y="340" width="328" height="330" rx="16" fill="#1a2930" stroke="#8ddab8" stroke-width="3"/><text x="1644" y="475" font-size="64">修正版</text><text x="1644" y="562" font-size="64">草稿</text></g>
    <text x="960" y="780" font-size="56">只修改查核過的主張，每項修正附申報出處。</text>
  </g>
</svg>
