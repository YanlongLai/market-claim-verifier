<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="color-scheme" content="light dark">
    <title>Page not found · DappGo</title>

    <style>
      :root { color-scheme: light dark; --bg: #f7f6f0; --ink: #18252c; --muted: #5d6a70; --accent: #236b50; }
      @media (prefers-color-scheme: dark) { :root { --bg: #10181c; --ink: #f0f5f1; --muted: #b6c2be; --accent: #7bd1a4; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; padding: clamp(24px, 8vw, 96px); display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
      main { width: min(100%, 640px); }
      h1 { margin: 20px 0; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.05; letter-spacing: -.04em; }
      p { color: var(--muted); max-width: 48ch; }
      nav { display: flex; flex-wrap: wrap; gap: 12px 28px; margin-top: 28px; }
      a { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); text-underline-offset: .2em; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
